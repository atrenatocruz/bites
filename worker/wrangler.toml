name = "bites-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
AI_MODEL = "claude-sonnet-5-5"
AUTH_MODE = "firebase"
DAILY_LIMIT = "30"
ALLOWED_ORIGINS = ""

[[kv_namespaces]]
binding = "RATE_KV"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_KV_ID"
